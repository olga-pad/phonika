<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf7"><title>Phonika</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8faf7;color:#183b35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:620px;min-height:100dvh;margin:auto;padding:20px max(18px,env(safe-area-inset-right)) 28px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.level{font-size:14px;color:#6a817b}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.letter{border:0;background:transparent;color:#1768b0;font:800 clamp(130px,42vw,230px)/1 Arial,sans-serif;padding:12px 35px;cursor:pointer;touch-action:manipulation}.letter:active,.picture:active{transform:scale(.96)}.example{margin-top:34px;min-height:145px}.picture{border:0;background:transparent;font-size:76px;line-height:1.1;padding:8px 18px;cursor:pointer;touch-action:manipulation}.word{font-size:27px;font-weight:700;margin-top:6px}.bottom{display:grid;gap:12px}.btn{border:0;border-radius:17px;min-height:56px;font:700 17px inherit;cursor:pointer}.next{background:#287c6b;color:white}.dots{display:flex;justify-content:center;gap:8px;margin:0 0 18px}.dot{width:8px;height:8px;border-radius:50%;background:#d4dfda}.dot.on{background:#287c6b}@media(max-width:420px){main{padding-top:14px}.example{margin-top:24px}.picture{font-size:68px}}
</style></head><body><main>
<div class="top"><div class="brand">Phonika</div><div class="level">English · Sounds 1</div></div>
<section class="stage"><button id="letter" class="letter" aria-label="Hear the sound">s</button><div class="example"><button id="picture" class="picture" aria-label="Hear the word">☀️</button><div id="word" class="word">sun</div></div></section>
<div id="dots" class="dots"></div><div class="bottom"><button id="next" class="btn next">Next</button></div>
</main><script src="./app.js?v=4"></script></body></html>
