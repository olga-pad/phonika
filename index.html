<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf7"><title>Phonika</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf7;color:#183b35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:620px;min-height:100dvh;margin:auto;padding:18px max(18px,env(safe-area-inset-right)) 28px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.settings{border:0;background:transparent;color:#55716a;font:600 15px inherit;padding:9px;cursor:pointer}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#edf3f0;border-radius:15px;padding:4px;margin-top:14px}.tab{border:0;background:transparent;border-radius:12px;padding:10px;font:700 15px inherit;color:#627a74}.tab.on{background:white;color:#235f52;box-shadow:0 1px 3px #0001}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.letter,.readword{font:800 clamp(140px,44vw,240px)/1 Arial,sans-serif}.letter.cursive,.readword.cursive{font-family:"Bad Script",cursive;font-weight:400;line-height:1.2}.readword{font-size:clamp(70px,20vw,112px);letter-spacing:.12em}.vowel{color:#c62828}.consonant{color:#1565c0}.example{min-height:145px;margin-top:22px;display:flex;align-items:center;justify-content:center}.picture{border:0;background:transparent;font-size:82px;line-height:1.1;padding:8px 18px;cursor:pointer}.picture:active{transform:scale(.96)}.listen{border:0;border-radius:17px;min-height:56px;padding:0 28px;background:#e8f2ed;color:#235f52;font:700 17px inherit;cursor:pointer}.know{position:absolute;right:0;top:18px;width:46px;height:46px;border:0;border-radius:50%;background:#edf5f1;color:#4d756b;font-size:24px;font-weight:800;cursor:pointer}.know.done{background:#248267;color:white}.know:disabled:not(.done){opacity:.55}.bottom{display:grid;gap:10px}.btn{border:0;border-radius:17px;min-height:56px;font:700 17px inherit;cursor:pointer}.next{background:#287c6b;color:white}.dots{display:flex;justify-content:center;gap:8px;margin:0 0 18px}.dot{width:8px;height:8px;border-radius:50%;background:#d4dfda}.dot.on{background:#287c6b}.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.star{font-size:92px;line-height:1;margin-bottom:22px}.finish h1{font-size:32px;margin:0 0 32px}.continue{width:min(100%,360px);background:#287c6b;color:white}.overlay{position:fixed;inset:0;background:rgba(24,59,53,.18);display:flex;align-items:flex-end;justify-content:center}.panel{width:min(100%,620px);background:white;border-radius:24px 24px 0 0;padding:22px 20px max(28px,env(safe-area-inset-bottom))}.panel h2{margin:0 0 16px;font-size:20px}.panel h2:not(:first-child){margin-top:22px}.mode{width:100%;border:1px solid #d6e2dd;background:white;color:#365f56;border-radius:13px;padding:12px;font:600 16px inherit}.close{width:100%;margin-top:18px;background:#edf5f1;color:#315f55}[hidden]{display:none!important}@media(max-width:420px){main{padding-top:12px}.picture{font-size:74px}.know{top:8px}}
</style></head><body><main><div class="top"><div id="brand" class="brand">Phonika · Level 1</div><button id="settingsOpen" class="settings">For parents</button></div><div id="tabs" class="tabs"><button id="learnTab" class="tab on">Learn</button><button id="readTab" class="tab">Read</button></div><section id="practice" class="stage"><button id="know" class="know" aria-label="I know this letter" title="I know this letter">✓</button><div id="letter" class="letter">s</div><div id="readword" class="readword" hidden>sat</div><div class="example"><button id="listen" class="listen">🔊 Listen</button><button id="picture" class="picture" aria-label="Hear the word" hidden>☀️</button></div></section><div id="dots" class="dots"></div><div id="bottom" class="bottom"><button id="next" class="btn next">Next</button></div><section id="finish" class="finish" hidden><div class="star" aria-hidden="true">⭐</div><h1>Great job!</h1><button id="continue" class="btn continue">Continue</button></section></main><div id="settings" class="overlay" hidden><div class="panel"><h2>Level</h2><select id="level" class="mode"><option value="1">Level 1 · s a t p i n</option><option value="2">Level 2 · m d g o</option></select><h2>Letter style</h2><select id="mode" class="mode"><option value="lower">abc</option><option value="title">Abc</option><option value="upper">ABC</option><option value="cursiveLower">𝒶𝒷𝒸</option><option value="cursiveTitle">𝒜𝒷𝒸</option><option value="cursiveUpper">𝒜ℬ𝒞</option></select><button id="settingsClose" class="btn close">Done</button></div></div><script src="./app.js?v=13"></script></body></html>
