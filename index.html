<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7faf8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Phonika EN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:#173b35;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:700px;margin:auto;padding:18px max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left))}#childView{height:100dvh;overflow:hidden;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;min-height:48px;flex:0 0 auto}.brand{font-weight:750}.brand span,.quiet{color:#55746d}button,select{font:inherit}button{border:0;cursor:pointer;border-radius:16px;padding:11px 16px;min-height:46px;font-weight:700;touch-action:manipulation}.quiet{background:transparent;color:#55746d}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eaf1ee;border-radius:18px;padding:5px;margin:8px 0;flex:0 0 auto}.tab{background:transparent;color:#55746d;font-weight:500}.tab.on{background:white;color:#315f55;box-shadow:0 2px 7px #173b3512}.learning{min-height:0;flex:1;display:flex;flex-direction:column;text-align:center;overflow:hidden}.stage{min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;position:relative}.letter{font:800 clamp(80px,23vw,170px)/1 Arial,sans-serif}.word{font:800 clamp(62px,18vw,108px)/1.1 Arial,sans-serif;letter-spacing:.035em}.letter.cursive,.word.cursive{font-family:"Bad Script",cursive;font-weight:400}.vowel{color:#c62828!important}.consonant{color:#1565c0!important}.picture-slot{width:100%;height:108px;min-height:108px;margin:24px 0;display:flex;align-items:center;justify-content:center}.picture{border:0;background:transparent;font-size:76px;line-height:1;padding:0;min-height:0}.actions{display:grid;gap:8px;width:min(100%,470px);margin:0 auto;flex:0 0 auto}.primary{background:#277c6b;color:white}.help{background:#fff0df;color:#8d431e}.soft{background:#edf5f1;color:#315f55}.mastery{background:#e5f3ed;color:#17614f}.mastery.done{background:#248267;color:white}.mastery:disabled:not(.done){opacity:.55}.dots{display:flex;justify-content:center;gap:8px;min-height:18px;margin:2px 0}.dot{width:8px;height:8px;border-radius:50%;background:#d4dfda}.dot.on{background:#277c6b}.finish{min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.star{font-size:92px}.continue{width:min(100%,360px)}.overlay{position:fixed;inset:0;background:rgba(24,59,53,.18);display:flex;align-items:flex-end;justify-content:center;overflow:auto}.panel{width:min(100%,700px);background:white;border-radius:24px 24px 0 0;padding:22px 20px max(28px,env(safe-area-inset-bottom))}.panel h2{margin:0 0 16px;font-size:20px}.panel h2:not(:first-child){margin-top:22px}.mode{width:100%;min-height:52px;border:1px solid #cadbd3;border-radius:13px;background:white;color:#173b35;padding:10px 14px}.close{width:100%;margin-top:18px;background:#edf5f1;color:#315f55}[hidden]{display:none!important}@media(max-width:430px){.app{padding-top:8px;padding-bottom:10px}.tabs{margin:6px 0}.stage{padding:4px 0}.picture-slot{height:96px;min-height:96px;margin:18px 0}.picture{font-size:70px}.actions{gap:7px}.actions button{min-height:44px;padding:9px 14px}}@media(max-height:700px){#childView header{min-height:40px}.picture-slot{height:82px;min-height:82px;margin:12px 0}.picture{font-size:62px}.letter{font-size:clamp(70px,20vw,135px)}.word{font-size:clamp(54px,16vw,90px)}.actions{gap:6px}.actions button{min-height:40px;padding:7px 12px}.tabs{margin:4px 0}}
</style></head><body><main id="childView" class="app"><header><div id="brand" class="brand">Phonika <span>EN</span></div><button id="settingsOpen" class="quiet">For parents</button></header><div id="tabs" class="tabs"><button id="learnTab" class="tab on">Sounds</button><button id="readTab" class="tab">I read</button></div><section id="practice" class="learning"><div class="stage"><div id="letter" class="letter">s</div><div id="readword" class="word" hidden>sat</div><div class="picture-slot"><button id="picture" class="picture" aria-label="Hear the word" hidden>☀️</button></div></div><div id="dots" class="dots"></div><div id="bottom" class="actions"><button id="help" class="help">🔊 Help me read</button><button id="showPicture" class="soft">Show picture</button><button id="know" class="mastery">✓ I read it myself</button><button id="next" class="primary">Next</button></div></section><section id="finish" class="finish" hidden><div class="star" aria-hidden="true">⭐</div><h1>Great job!</h1><button id="continue" class="primary continue">Continue</button></section></main><div id="settings" class="overlay" hidden><div class="panel"><h2>Level</h2><select id="level" class="mode"><option value="1">Level 1 · s a t p i n</option><option value="2">Level 2 · m d g o</option></select><h2>Letter style</h2><select id="mode" class="mode"><option value="lower">abc</option><option value="title">Abc</option><option value="upper">ABC</option><option value="cursiveLower">𝒶𝒷𝒸</option><option value="cursiveTitle">𝒜𝒷𝒸</option><option value="cursiveUpper">𝒜ℬ𝒞</option></select><button id="settingsClose" class="primary close">Done</button></div></div><script src="./app.js?v=16"></script></body></html>
